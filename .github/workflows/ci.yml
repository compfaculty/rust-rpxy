name: Linux Tests

on:
  push:
  pull_request:
    types: [synchronize, opened]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Default (Quinn)
            cargo_args: --workspace
          - name: TCP only
            cargo_args: -p rpxy -p rpxy-lib --no-default-features --features rpxy/rustls-backend
          - name: s2n-quic
            cargo_args: -p rpxy -p rpxy-lib --no-default-features --features rpxy/http3-s2n,rpxy/rustls-backend

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The runner image's preinstalled Rust can lag behind the latest stable,
      # while the workspace tracks it via `rust-version`.
      - name: Update Rust toolchain to latest stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: Run unit and integration tests
        run: cargo test --locked ${{ matrix.cargo_args }}
